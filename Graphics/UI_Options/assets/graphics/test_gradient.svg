<svg viewBox="0 0 300 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="lg1">
      <stop offset="0"   stop-color="#ff0000"/>
      <stop offset="0.5" stop-color="#ffff00"/>
      <stop offset="1"   stop-color="#0000ff"/>
    </linearGradient>
    <linearGradient id="lg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#00c8ff"/>
      <stop offset="1" stop-color="#004080"/>
    </linearGradient>
    <radialGradient id="rg1">
      <stop offset="0"   stop-color="#ffffff"/>
      <stop offset="0.7" stop-color="#ff8000"/>
      <stop offset="1"   stop-color="#802000"/>
    </radialGradient>
  </defs>
  <rect x="10"  y="10"  width="120" height="80" fill="url(#lg1)"/>
  <rect x="10"  y="110" width="120" height="80" fill="url(#lg2)"/>
  <circle cx="220" cy="100" r="80" fill="url(#rg1)"/>
