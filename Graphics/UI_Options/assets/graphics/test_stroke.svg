<svg viewBox="0 0 320 210" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <linearGradient id="g"><stop offset="0" stop-color="#e74c3c"/><stop offset="0.5" stop-color="#f1c40f"/><stop offset="1" stop-color="#2980b9"/></linearGradient>
    <radialGradient id="r"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#8e44ad"/></radialGradient>
  </defs>

  <!-- borde con gradiente lineal, SIN relleno encima -->
  <rect x="20" y="20" width="130" height="70" fill="none" stroke="url(#g)" stroke-width="14"/>

  <!-- borde con gradiente radial -->
  <circle cx="240" cy="55" r="38" fill="none" stroke="url(#r)" stroke-width="14"/>

  <!-- linea gruesa con gradiente -->
  <path d="M20 160 L300 160" fill="none" stroke="url(#g)" stroke-width="22"/>

  <!-- relleno + borde con gradiente, distintos gradientes -->
  <rect x="20" y="185" width="280" height="18" fill="url(#g)" stroke="url(#r)" stroke-width="6"/>
</svg>
