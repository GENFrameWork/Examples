<svg viewBox="0 0 240 140" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <g id="star" fill="#f1c40f" stroke="#b8860b" stroke-width="2">
      <polygon points="0,-18 5,-6 18,-6 8,2 12,15 0,7 -12,15 -8,2 -18,-6 -5,-6"/>
    </g>
    <circle id="dot" cx="0" cy="0" r="12" fill="#3498db" stroke="#1a5276" stroke-width="2"/>
  </defs>

  <use href="#star" x="30" y="30"/>
  <use href="#star" x="90" y="40" transform="rotate(18)"/>
  <use xlink:href="#dot" x="170" y="35"/>
  <use href="#dot" x="120" y="100" transform="scale(1.4)"/>
  <use href="#star" x="210" y="100"/>
</svg>
